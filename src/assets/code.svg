<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" role="img" aria-label="Modern VS Code style portfolio code editor">
  <style>
    :root { color-scheme: light dark; }

    .window { fill:#ffffff; stroke:#d8dee4; }
    .chrome { fill:#f6f8fa; }
    .editor { fill:#ffffff; }
    .tab { fill:#ffffff; }
    .divider { stroke:#e5e7eb; }
    .text { fill:#24292f; }
    .muted { fill:#6e7781; }
    .tag { fill:#c62828; }
    .attr { fill:#8a4b00; }
    .string { fill:#0b5cad; }
    .keyword { fill:#7b3fb3; }
    .function { fill:#0a6e3e; }
    .number { fill:#995000; }
    .comment { fill:#5f6b76; }
    .accent { fill:#0969da; }

    @media (prefers-color-scheme: dark) {
      .window { fill:#1e1e1e; stroke:#3b3b3b; }
      .chrome { fill:#181818; }
      .editor { fill:#1e1e1e; }
      .tab { fill:#1e1e1e; }
      .divider { stroke:#303030; }
      .text { fill:#d4d4d4; }
      .muted { fill:#858585; }
      .tag { fill:#569cd6; }
      .attr { fill:#9cdcfe; }
      .string { fill:#ce9178; }
      .keyword { fill:#c586c0; }
      .function { fill:#dcdcaa; }
      .number { fill:#b5cea8; }
      .comment { fill:#6a9955; }
      .accent { fill:#4fc1ff; }
    }

    text {
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 21px;
    }

    .small {
      font-size: 16px;
    }

    .title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 15px;
    }

    .line-number {
      font-size: 17px;
    }
  </style>

  <!-- Editor window -->
  <rect class="window" x="25" y="25" width="1350" height="770" rx="16"/>

  <!-- Top application chrome -->
  <rect class="chrome" x="25" y="25" width="1350" height="52" rx="16"/>
  <rect class="chrome" x="25" y="51" width="1350" height="26"/>

  <!-- macOS controls -->
  <circle cx="56" cy="51" r="7" fill="#ff5f57"/>
  <circle cx="80" cy="51" r="7" fill="#febc2e"/>
  <circle cx="104" cy="51" r="7" fill="#28c840"/>

  <text class="title muted" x="700" y="56" text-anchor="middle">portfolio — Visual Studio Code</text>

  <!-- Tabs -->
  <rect class="tab" x="145" y="77" width="180" height="48"/>
  <text class="accent small" x="168" y="107">index.html</text>
  <line class="divider" x1="145" y1="125" x2="325" y2="125"/>

  <rect class="chrome" x="325" y="77" width="170" height="48"/>
  <text class="muted small" x="348" y="107">styles.css</text>

  <rect class="chrome" x="495" y="77" width="175" height="48"/>
  <text class="muted small" x="518" y="107">script.js</text>

  <!-- Editor area -->
  <rect class="editor" x="25" y="125" width="1350" height="670"/>
  <line class="divider" x1="105" y1="125" x2="105" y2="795"/>

  <!-- Line numbers -->
  <g class="muted line-number" text-anchor="end">
    <text x="82" y="160">1</text>
    <text x="82" y="190">2</text>
    <text x="82" y="220">3</text>
    <text x="82" y="250">4</text>
    <text x="82" y="280">5</text>
    <text x="82" y="310">6</text>
    <text x="82" y="340">7</text>
    <text x="82" y="370">8</text>
    <text x="82" y="400">9</text>
    <text x="82" y="430">10</text>
    <text x="82" y="460">11</text>
    <text x="82" y="490">12</text>
    <text x="82" y="520">13</text>
    <text x="82" y="550">14</text>
    <text x="82" y="580">15</text>
    <text x="82" y="610">16</text>
    <text x="82" y="640">17</text>
    <text x="82" y="670">18</text>
    <text x="82" y="700">19</text>
    <text x="82" y="730">20</text>
    <text x="82" y="760">21</text>
  </g>

  <!-- Advanced portfolio HTML -->
  <g xml:space="preserve">
    <text x="125" y="160" class="comment">&lt;!-- Interactive portfolio experience --&gt;</text>

    <text x="125" y="190">
      <tspan class="tag">&lt;section</tspan>
      <tspan class="attr"> id</tspan><tspan class="text">=</tspan><tspan class="string">"hero"</tspan>
      <tspan class="attr"> aria-labelledby</tspan><tspan class="text">=</tspan><tspan class="string">"hero-title"</tspan>
      <tspan class="tag">&gt;</tspan>
    </text>

    <text x="125" y="220">
      <tspan class="tag">&lt;div</tspan>
      <tspan class="attr"> class</tspan><tspan class="text">=</tspan><tspan class="string">"hero__content"</tspan>
      <tspan class="tag">&gt;</tspan>
    </text>

    <text x="125" y="250">
      <tspan class="tag">&lt;span</tspan>
      <tspan class="attr"> class</tspan><tspan class="text">=</tspan><tspan class="string">"eyebrow"</tspan>
      <tspan class="tag">&gt;</tspan>
      <tspan class="text">FULL-STACK ENGINEER</tspan>
      <tspan class="tag">&lt;/span&gt;</tspan>
    </text>

    <text x="125" y="280">
      <tspan class="tag">&lt;h1</tspan>
      <tspan class="attr"> id</tspan><tspan class="text">=</tspan><tspan class="string">"hero-title"</tspan>
      <tspan class="tag">&gt;</tspan>
    </text>

    <text x="125" y="310">
      <tspan class="text">Building </tspan>
      <tspan class="keyword">digital</tspan>
      <tspan class="text"> experiences</tspan>
      <tspan class="tag">&lt;br /&gt;</tspan>
    </text>

    <text x="125" y="340">
      <tspan class="text">that feel </tspan>
      <tspan class="tag">&lt;strong&gt;</tspan>
      <tspan class="text">effortless.</tspan>
      <tspan class="tag">&lt;/strong&gt;</tspan>
    </text>

    <text x="125" y="370">
      <tspan class="tag">&lt;/h1&gt;</tspan>
    </text>

    <text x="125" y="400">
      <tspan class="tag">&lt;p</tspan>
      <tspan class="attr"> class</tspan><tspan class="text">=</tspan><tspan class="string">"hero__description"</tspan>
      <tspan class="tag">&gt;</tspan>
    </text>

    <text x="125" y="430">
      <tspan class="text">React · TypeScript · Node.js · GraphQL · AWS</tspan>
    </text>

    <text x="125" y="460">
      <tspan class="tag">&lt;/p&gt;</tspan>
    </text>

    <text x="125" y="490">
      <tspan class="tag">&lt;button</tspan>
      <tspan class="attr"> type</tspan><tspan class="text">=</tspan><tspan class="string">"button"</tspan>
      <tspan class="attr"> data-action</tspan><tspan class="text">=</tspan><tspan class="string">"projects"</tspan>
      <tspan class="tag">&gt;</tspan>
      <tspan class="text">Explore work</tspan>
      <tspan class="tag">&lt;/button&gt;</tspan>
    </text>

    <text x="125" y="520">
      <tspan class="tag">&lt;/div&gt;</tspan>
    </text>

    <text x="125" y="550">
      <tspan class="tag">&lt;canvas</tspan>
      <tspan class="attr"> id</tspan><tspan class="text">=</tspan><tspan class="string">"hero-scene"</tspan>
      <tspan class="attr"> aria-hidden</tspan><tspan class="text">=</tspan><tspan class="string">"true"</tspan>
      <tspan class="tag">&gt;&lt;/canvas&gt;</tspan>
    </text>

    <text x="125" y="580" class="comment">&lt;!-- Progressive enhancement --&gt;</text>

    <text x="125" y="610">
      <tspan class="tag">&lt;noscript&gt;</tspan>
      <tspan class="text">JavaScript is required for the 3D experience.</tspan>
      <tspan class="tag">&lt;/noscript&gt;</tspan>
    </text>

    <text x="125" y="640">
      <tspan class="tag">&lt;/section&gt;</tspan>
    </text>

    <text x="125" y="685" class="comment">&lt;!-- Micro-interactions --&gt;</text>

    <text x="125" y="715">
      <tspan class="keyword">const</tspan>
      <tspan class="function">reveal</tspan>
      <tspan class="text"> = (target) =&gt; target.</tspan>
      <tspan class="function">classList</tspan><tspan class="text">.</tspan><tspan class="function">add</tspan><tspan class="text">(</tspan><tspan class="string">"is-visible"</tspan><tspan class="text">);</tspan>
    </text>

    <text x="125" y="745">
      <tspan class="keyword">const</tspan>
      <tspan class="text"> observer = </tspan>
      <tspan class="keyword">new</tspan>
      <tspan class="function">IntersectionObserver</tspan>
      <tspan class="text">(entries =&gt; entries.</tspan><tspan class="function">forEach</tspan><tspan class="text">(entry =&gt; {</tspan>
    </text>

    <text x="125" y="775">
      <tspan class="text">  </tspan><tspan class="keyword">if</tspan><tspan class="text"> (entry.isIntersecting) </tspan>
      <tspan class="function">reveal</tspan><tspan class="text">(entry.target);</tspan>
      <tspan class="text"> });</tspan>
    </text>
  </g>

  <!-- Cursor -->
  <rect class="accent" x="1090" y="757" width="2.5" height="25"/>
</svg>
